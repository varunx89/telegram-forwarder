<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Telegram Forwarder{% endblock %}</title>
    <link rel="stylesheet" href="/static/style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <header class="navbar">
        <div class="nav-container">
            <div class="brand">
                <span class="brand-icon">⚡</span>
                <span class="brand-title">Telegram Forwarder</span>
                <span class="badge badge-telethon">Telethon</span>
            </div>
            <div class="nav-actions">
                {% if request.cookies.get('tg_fwd_session') %}
                <a href="/logout" class="btn btn-outline btn-sm">Lock Dashboard</a>
                {% endif %}
            </div>
        </div>
    </header>

    <main class="container">
        {% block content %}{% endblock %}
    </main>

    <footer class="footer">
        <div class="container">
            <p>Secure Telegram Forwarding Service • Running on Render</p>
        </div>
    </footer>

    {% block scripts %}{% endblock %}
</body>
</html>
